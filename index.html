<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technoes POS - Point of Sale System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="pos-container">
        <!-- Header -->
        <header class="pos-header">
            <div class="logo">
                <h1>🛒 Technoes POS</h1>
            </div>
            <div class="header-info">
                <span id="current-date"></span>
                <span id="current-time"></span>
            </div>
        </header>

        <!-- Main Content -->
        <div class="pos-main">
            <!-- Left Panel - Products -->
            <div class="products-panel">
                <div class="panel-header">
                    <h2>Products</h2>
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="Search products...">
                    </div>
                </div>
                
                <div class="category-tabs">
                    <button class="category-tab active" data-category="all">All</button>
                    <button class="category-tab" data-category="food">Food</button>
                    <button class="category-tab" data-category="drinks">Drinks</button>
                    <button class="category-tab" data-category="electronics">Electronics</button>
                    <button class="category-tab" data-category="clothing">Clothing</button>
                </div>

                <div class="products-grid" id="products-grid">
                    <!-- Products will be dynamically loaded here -->
                </div>
            </div>

            <!-- Right Panel - Cart & Checkout -->
            <div class="cart-panel">
                <div class="panel-header">
                    <h2>Current Sale</h2>
                    <button class="btn-clear" id="clear-cart">Clear All</button>
                </div>

                <div class="cart-items" id="cart-items">
                    <div class="empty-cart">
                        <p>🛒 Cart is empty</p>
                        <p class="empty-cart-subtitle">Add items to start a sale</p>
                    </div>
                </div>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (10%):</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                </div>

                <div class="payment-section">
                    <div class="payment-methods">
                        <button class="payment-btn" data-method="cash">
                            <span class="payment-icon">💵</span>
                            Cash
                        </button>
                        <button class="payment-btn" data-method="card">
                            <span class="payment-icon">💳</span>
                            Card
                        </button>
                        <button class="payment-btn" data-method="mobile">
                            <span class="payment-icon">📱</span>
                            Mobile
                        </button>
                    </div>
                    <button class="btn-checkout" id="checkout-btn" disabled>
                        Complete Sale
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Receipt Modal -->
    <div class="modal" id="receipt-modal">
        <div class="modal-content receipt">
            <div class="receipt-header">
                <h2>🛒 Technoes POS - POS</h2>
                <p>Thank you for your purchase!</p>
                <p class="receipt-date" id="receipt-date"></p>
            </div>
            <div class="receipt-divider"></div>
            <div class="receipt-items" id="receipt-items"></div>
            <div class="receipt-divider"></div>
            <div class="receipt-summary">
                <div class="receipt-row">
                    <span>Subtotal:</span>
                    <span id="receipt-subtotal"></span>
                </div>
                <div class="receipt-row">
                    <span>Tax (10%):</span>
                    <span id="receipt-tax"></span>
                </div>
                <div class="receipt-row receipt-total">
                    <span>Total:</span>
                    <span id="receipt-total"></span>
                </div>
                <div class="receipt-row">
                    <span>Payment Method:</span>
                    <span id="receipt-payment"></span>
                </div>
            </div>
            <div class="receipt-footer">
                <p>Transaction ID: <span id="transaction-id"></span></p>
                <p>Have a great day!</p>
            </div>
            <div class="modal-actions">
                <button class="btn-print" onclick="window.print()">🖨️ Print</button>
                <button class="btn-close" id="close-receipt">New Sale</button>
            </div>
        </div>
    </div>

    <!-- Cash Payment Modal -->
    <div class="modal" id="cash-modal">
        <div class="modal-content">
            <h2>Cash Payment</h2>
            <div class="cash-input-section">
                <div class="amount-display">
                    <label>Total Amount:</label>
                    <div class="amount" id="cash-total">$0.00</div>
                </div>
                <div class="cash-input">
                    <label for="cash-received">Cash Received:</label>
                    <input type="number" id="cash-received" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="change-display">
                    <label>Change:</label>
                    <div class="change-amount" id="change-amount">$0.00</div>
                </div>
            </div>
            <div class="quick-amounts">
                <button class="quick-amount" data-amount="5">$5</button>
                <button class="quick-amount" data-amount="10">$10</button>
                <button class="quick-amount" data-amount="20">$20</button>
                <button class="quick-amount" data-amount="50">$50</button>
                <button class="quick-amount" data-amount="100">$100</button>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancel-cash">Cancel</button>
                <button class="btn-confirm" id="confirm-cash" disabled>Confirm Payment</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
